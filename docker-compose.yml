services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: law
      POSTGRES_PASSWORD: law
      POSTGRES_DB: law
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U law"]
      interval: 2s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgres://law:law@db:5432/law
      PORT: 3001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model-cache:/app/.cache

volumes:
  db-data:
  model-cache:
